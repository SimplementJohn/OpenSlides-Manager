<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Boîte à outils web open source pour présentations et images : détourage et slides de chargement. 100% local, gratuit, sans compte." />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/svg+xml" href="/icon-slides.svg" />
    <link rel="icon" type="image/png" href="/icon-slides.png" />
    <link rel="apple-touch-icon" href="/icon-slides.png" />
    <meta property="og:title" content="OpenSlides Manager" />
    <meta property="og:description" content="Boîte à outils open source pour tes slides et images. 100% local, gratuit, sans compte." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-slides.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
    <title>OpenSlides Manager — Boîte à outils open source pour tes slides</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
